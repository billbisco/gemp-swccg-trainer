[project]
name = "gemp-swccg-trainer"
version = "0.1.0"
description = "Local self-play trainer + thin FastAPI UI for SWCCG GEMP bots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
gemp-swccg-trainer = "trainer.app:main"

[tool.setuptools.packages.find]
include = ["trainer*"]
