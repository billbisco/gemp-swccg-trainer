# Day-1 local trainer config (collect + watch; learning comes later)

[gym]
# Prefer Maven headless batch on feature/headless-bot-vs-bot when available.
# gym-cli shaded jar is not required for day-1 UI.
gemp_repo = "/workspace/swccg-gemp"
headless_branch = "feature/headless-bot-vs-bot"
# process | mock  — auto falls back to mock if Maven/headless unavailable
runner = "auto"
format = "premiere_anh"
dark_ai = "BEGINNER"
light_ai = "BEGINNER"
decks = "wc96"
replay = true
max_millis = 300000
max_decisions = 25000

[decks]
# Librarian WC96 — now playable via headless.decks=wc96 (premiere_anh).
dark = "decks/wc96-anh-dark.txt"
light = "decks/wc96-anh-light.txt"
playable_dark = "decks/wc96-anh-dark.txt"
playable_light = "decks/wc96-anh-light.txt"
dark_name = "P-ANH 1996 World Champion (Dark)"
light_name = "P-ANH 1996 World Champion (Light)"
# Fallback Open 40 still available with gym.decks = "open40"
open40_dark = "decks/open40-beginner-dark.txt"
open40_light = "decks/open40-beginner-light.txt"

[workers]
worker_mode = "process"
batch_games_k = 1
workers = 1
seed_base = 42
disk_budget_gb = 20

[ui]
host = "0.0.0.0"
port = 8765
# Watch falls back to this committed sample when no run has finished yet.
sample_replay_dir = "runs/_sample/wc96-replay"
